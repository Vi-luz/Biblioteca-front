<!--
 Tabela BootStrap para exibir a lista de livros com suas informações, incluindo capa,
 título, autor, editora e status,puxando css direto no html.
-->

<table class="table table-hover align-middle">
  <thead class="table-light">

    <tr>
      <th>Livro</th>
      <th>Autor</th>
      <th>Editora</th>
      <th>Status</th>
      <th>Ações</th>
      <th class="direita">
         <button type="button" class="btn btn-primary btn-rounded" mdbRipple routerLink="/admin/livros/new/">
        Adicionar Livro
      </button>
      </th>
    </tr>
  </thead>
  <tbody>
    @for (livro of lista; track $index) {
    <tr>
      <td>
        <div class="d-flex align-items-center">
          <img
            [src]="livro.capa"
            alt="Capa de {{ livro.titulo }}"
            style="width: 120px; height: 160px; object-fit: cover"
            class="rounded"
          />
          <div class="ms-3">
            <p class="fw-bold mb-0">{{ livro.titulo }}</p>
            <p class="text-muted mb-0 small">ID: {{ livro.id }}</p>
          </div>
        </div>
      </td>
      <td>{{ livro.autor }}</td>
      <td>{{ livro.editora }}</td>
      <td>
        <span class="badge text-bg-success rounded-pill">Disponível</span>
      </td>
      <td>
        <button
          type="button"
          class="btn btn-warning btn-rounded btn-sm text-decoration-none fw-bold"
          [routerLink]="['/admin/livros/edit', livro.id]"
          [state]="{ livro: livro }">
          Editar
        </button>
        <button
          type="button"
          class="btn btn-danger btn-rounded btn-sm text-decoration-none fw-bold"
          (click)="deletarLivro(livro)">
          Deletar
        </button>

      </td>
    </tr>
    }
  </tbody>
</table>
